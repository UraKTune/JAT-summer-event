<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle — JAT Event</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .toolbar {
      display: flex; align-items: center; gap: 1rem;
      margin-bottom: 1.5rem; flex-wrap: wrap;
    }
    .item-list { display: flex; flex-direction: column; gap: 0.5rem; }

    /* ── Item card ───────────────────────────────────────────── */
    .pz-item {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .pz-item:hover { border-color: var(--border2); }
    .pz-item.done  { border-color: rgba(6,214,160,0.3); }

    /* ── Header row ──────────────────────────────────────────── */
    .pz-header {
      display: flex; align-items: stretch;
      cursor: pointer; user-select: none;
      background: var(--bg2); transition: background 0.15s;
    }
    .pz-header:hover { background: var(--bg3); }

    /* left block */
    .pz-main {
      flex: 1; min-width: 0;
      padding: 0.9rem 1.1rem;
    }
    .pz-name {
      font-family: var(--font-display); font-weight: 700;
      font-size: 1rem; line-height: 1.3;
    }
    .pz-creator {
      font-size: 0.78rem; color: var(--text3); margin-top: 0.1rem;
    }

    /* right pill ─ points */
    .pz-pill {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 0 1.1rem;
      border-left: 1px solid var(--border);
      background: var(--bg3);
      font-family: var(--font-display); font-weight: 700;
      font-size: 1rem; color: var(--gold);
      white-space: nowrap; gap: 0.4rem;
    }
    .pz-pill .done-dot {
      width: 18px; height: 18px; background: var(--green); color: #0d0d0f;
      border-radius: 50%; font-size: 0.65rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .pz-chev {
      flex-shrink: 0; display: flex; align-items: center;
      padding: 0 0.9rem; color: var(--text3); font-size: 0.65rem;
      border-left: 1px solid var(--border);
    }
    .pz-chev svg { transition: transform 0.18s; }
    .pz-item.open .pz-chev svg { transform: rotate(180deg); }

    /* ── Body ────────────────────────────────────────────────── */
    .pz-body {
      display: none;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    .pz-item.open .pz-body { display: block; }

    .pz-content-wrap { padding: 1rem 1.1rem 0; }
    .pz-content {
      font-size: 0.88rem; color: var(--text2);
      line-height: 1.7; white-space: pre-line;
    }
    .pz-note {
      font-size: 0.8rem; color: var(--gold);
      background: rgba(255,209,102,0.07);
      border-left: 2px solid var(--gold);
      padding: 0.4rem 0.8rem; margin-top: 0.7rem;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    /* tags */
    .pz-tags {
      display: flex; flex-wrap: wrap; gap: 0.35rem;
      padding: 0.65rem 1.1rem 0;
    }
    .pz-tag {
      font-size: 0.72rem; padding: 0.18rem 0.65rem;
      border-radius: 99px; border: 1px solid var(--border2);
      color: var(--text2); background: var(--bg3); white-space: nowrap;
    }
    .pz-tag.done-t { border-color: rgba(6,214,160,0.3); color: var(--green); background: rgba(6,214,160,0.07); }
    .pz-tag.accent { border-color: rgba(0,212,255,0.3); color: var(--accent3); background: rgba(0,212,255,0.07); }

    /* files */
    .pz-files {
      display: flex; flex-wrap: wrap; gap: 0.45rem;
      padding: 0.65rem 1.1rem;
    }
    .file-link {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.78rem; color: var(--accent3);
      background: rgba(0,212,255,0.07); border: 1px solid rgba(0,212,255,0.2);
      border-radius: var(--radius-sm); padding: 0.28rem 0.7rem;
      text-decoration: none; transition: background 0.15s;
    }
    .file-link:hover { background: rgba(0,212,255,0.15); text-decoration: none; }

    /* action row */
    .pz-actions {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem; flex-wrap: wrap;
      padding: 0.65rem 1.1rem 0.9rem;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
    }
    .pz-completions { font-size: 0.78rem; color: var(--text3); }
    .btn-complete { font-size: 0.8rem; padding: 0.38rem 0.9rem; }

    .empty-state { text-align:center; padding:4rem 1rem; color:var(--text3); }
    .empty-state p { margin-top:0.5rem; font-size:0.9rem; }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">Just A Team</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="puzzle.html" class="active">Puzzle</a>
    <a href="competition.html">Competition</a>
    <a href="leaderboard.html">Leaderboard</a>
  </div>
  <div id="nav-auth"></div>
</nav>

<main class="page">
  <h1 class="section-title">Puzzle</h1>
  <p class="section-sub">30 câu đố — hoàn thành càng nhiều, điểm càng cao</p>

  <div class="toolbar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="Tìm theo tên hoặc tag...">
    </div>
    <span id="puzzle-count" style="color:var(--text3);font-size:0.85rem;margin-left:auto"></span>
  </div>

  <div id="puzzle-list" class="item-list">
    <div class="loading-wrap"><div class="spinner"></div></div>
  </div>
</main>

<div id="toast"></div>
<script src="env.js"></script>
<script src="app.js"></script>
<script>
  let ALL_PUZZLES=[], filteredPuzzles=[];
  let completedSet=new Set(), completedCount={};
  const expanded={};

  function calcPts(count){
    if(!count||count===0)return 40;
    return count===1?40:Math.ceil(30/count);
  }

  function renderList(list){
    const el=document.getElementById('puzzle-list');
    document.getElementById('puzzle-count').textContent=`${list.length} / ${ALL_PUZZLES.length} puzzle`;
    if(!list.length){
      el.innerHTML=`<div class="empty-state"><div style="font-size:2rem">🔍</div><p>Không tìm thấy puzzle nào</p></div>`;
      return;
    }
    const user=getUser();
    el.innerHTML=list.map(p=>{
      const done=completedSet.has(p.id);
      const count=completedCount[p.id]||0;
      const pts=calcPts(count);
      const isOpen=expanded[p.id]||false;

      const noteHtml=(p.note&&p.note.trim())?`<div class="pz-note">⚠ ${p.note}</div>`:'';

      const tags=[
        ...(p.tags||[]).map(t=>({cls:'',label:t})),
        done?{cls:'done-t',label:'Hoàn thành'}:null,
      ].filter(Boolean);
      const tagsHtml=tags.length
        ?`<div class="pz-tags">${tags.map(t=>`<span class="pz-tag ${t.cls}">${t.label}</span>`).join('')}</div>`:'' ;

      const filesHtml=(p.files&&p.files.length)
        ?`<div class="pz-files">${p.files.map(f=>`<a class="file-link" href="${f.url}" target="_blank">↗ ${f.label}</a>`).join('')}</div>`:'';

      let actionHtml;
      if (!user) {
        actionHtml = `<span style="font-size:0.8rem;color:var(--text3)">Đăng nhập để xem trạng thái</span>`;
      } else if (done) {
        actionHtml = `<span style="font-size:0.82rem;color:var(--green)">✓ Hoàn thành</span>`;
      } else {
        actionHtml = `<span style="font-size:0.8rem;color:var(--text3)">Chưa hoàn thành</span>`;
      }

      const bodyHtml=isOpen?`<div class="pz-body">
        <div class="pz-content-wrap">
          <div class="pz-content">${p.content}</div>
          ${noteHtml}
        </div>
        ${tagsHtml}
        ${filesHtml}
        <div class="pz-actions">
          <span class="pz-completions">${count>0?`${count} người hoàn thành`:'Chưa có ai'}</span>
          ${actionHtml}
        </div>
      </div>`:`<div class="pz-body"></div>`;

      return`<div class="pz-item ${done?'done':''} ${isOpen?'open':''}" id="pitem-${p.id}">
        <div class="pz-header" onclick="togglePuzzle(${p.id})">
          <div class="pz-main">
            <div class="pz-name">${p.name}</div>
            ${p.creator?`<div class="pz-creator">Creator: ${p.creator}</div>`:''}
          </div>
          <div class="pz-pill">
            ${done?`<div class="done-dot">✓</div>`:''}
            ${pts}đ
          </div>
          <div class="pz-chev">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
              <path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
        </div>
        ${bodyHtml}
      </div>`;
    }).join('');
  }

  function togglePuzzle(id){expanded[id]=!expanded[id];renderList(filteredPuzzles);}

  document.getElementById('search-input').addEventListener('input',function(){
    const q=this.value.toLowerCase().trim();
    filteredPuzzles=q
      ?ALL_PUZZLES.filter(p=>p.name.toLowerCase().includes(q)||(p.tags||[]).some(t=>t.toLowerCase().includes(q)))
      :[...ALL_PUZZLES];
    renderList(filteredPuzzles);
  });

  async function init(){
    try{ALL_PUZZLES=await(await fetch('puzzles.json')).json();filteredPuzzles=[...ALL_PUZZLES];}
    catch(e){document.getElementById('puzzle-list').innerHTML=`<div class="empty-state"><div style="font-size:2rem">⚠️</div><p>Không tải được puzzles.json.</p></div>`;return;}
    renderList(filteredPuzzles);
    try{
      const[lbRes,playerRes]=await Promise.all([
        apiGet('/api/leaderboard/full'),
        getUser()?fetchPlayerData(getUser().uid):Promise.resolve(null),
      ]);
      if(lbRes?.ok&&lbRes.completedCounts)completedCount=lbRes.completedCounts;
      if(playerRes?.ok)playerRes.data.quizzes.forEach((done,i)=>{if(done)completedSet.add(i);});
      renderList(filteredPuzzles);
    }catch(e){console.warn('BE không phản hồi:',e);}
  }

  document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
