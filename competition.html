<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competition — JAT Event</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .comp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }
    .challenge-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: border-color 0.2s, transform 0.2s;
      position: relative;
    }
    .challenge-card:hover { border-color: var(--border2); transform: translateY(-2px); }
    .challenge-card.submitted { border-color: rgba(0,212,255,0.4); }
    .challenge-card.submitted::after {
      content: '✓';
      position: absolute;
      top: 0.8rem; right: 0.9rem;
      width: 22px; height: 22px;
      background: var(--accent3);
      color: #0d0d0f;
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .challenge-header {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 0.5rem;
    }
    .challenge-name {
      font-family: var(--font-display); font-weight: 700;
      font-size: 1rem; line-height: 1.3; padding-right: 1.5rem;
    }
    .challenge-content {
      font-size: 0.88rem; color: var(--text2);
      line-height: 1.65; white-space: pre-line;
    }
    .challenge-note {
      font-size: 0.8rem; color: var(--gold);
      background: rgba(255,209,102,0.08);
      border-left: 2px solid var(--gold);
      padding: 0.4rem 0.7rem;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }
    .challenge-files { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .file-link {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: 0.78rem; color: var(--accent3);
      background: rgba(0,212,255,0.08);
      border: 1px solid rgba(0,212,255,0.2);
      border-radius: var(--radius-sm); padding: 0.25rem 0.65rem;
      text-decoration: none; transition: background 0.15s;
    }
    .file-link:hover { background: rgba(0,212,255,0.15); text-decoration: none; }

    /* Kết quả play vừa submit — chỉ score_val */
    .play-result {
      display: flex; align-items: center; gap: 0.6rem;
      background: var(--bg3); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 0.55rem 0.9rem;
      font-size: 0.82rem;
    }
    .play-result-label { color: var(--text3); }
    .play-result-val {
      font-family: var(--font-display); font-weight: 700;
      color: var(--accent3); font-size: 1rem;
    }
    .play-result-tag {
      margin-left: auto; font-size: 0.72rem; padding: 0.1rem 0.5rem;
      border-radius: 99px;
    }
    .tag-better { background: rgba(6,214,160,0.15); color: var(--green); }
    .tag-same   { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }

    /* Footer */
    .challenge-footer {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-top: auto; padding-top: 0.75rem;
      border-top: 1px solid var(--border);
      gap: 0.5rem; flex-wrap: wrap;
    }
    .current-score { font-size: 0.78rem; color: var(--text3); }
    .current-score strong {
      font-family: var(--font-display);
      color: var(--accent3); font-weight: 700;
    }
    .btn-submit { font-size: 0.8rem; padding: 0.4rem 0.9rem; }
    .cooldown-text { font-size: 0.75rem; color: var(--text3); white-space: nowrap; }

    /* Toggle leaderboard */
    .lb-toggle {
      width: 100%; display: flex; align-items: center;
      justify-content: space-between;
      background: transparent; border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 0.4rem 0.8rem;
      font-size: 0.78rem; color: var(--text2); cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      font-family: var(--font-body);
    }
    .lb-toggle:hover { border-color: var(--border2); background: var(--bg3); }
    .lb-toggle .chev { font-size: 0.65rem; color: var(--text3); transition: transform 0.18s; }
    .lb-toggle.open .chev { transform: rotate(180deg); }

    /* Mini leaderboard */
    .mini-lb { display: none; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .mini-lb.open { display: block; }
    .mini-lb-empty { text-align: center; padding: 1.2rem; color: var(--text3); font-size: 0.8rem; }

    table.mini-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .mini-table th {
      background: var(--bg3); padding: 0.45rem 0.75rem; text-align: left;
      font-family: var(--font-display); font-size: 0.65rem; font-weight: 700;
      letter-spacing: 0.07em; text-transform: uppercase; color: var(--text3);
      border-bottom: 1px solid var(--border);
    }
    .mini-table th.r, .mini-table td.r { text-align: right; }
    .mini-table td {
      padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .mini-table tr:last-child td { border-bottom: none; }
    .mini-table tr:hover td { background: var(--bg3); }
    .mini-table tr.me td { background: rgba(0,212,255,0.05); }

    .mini-rank { font-family: var(--font-display); font-weight: 800; width: 28px; text-align: center; }
    .r1 { color: var(--gold); } .r2 { color: var(--silver); } .r3 { color: var(--bronze); }
    .mini-player { display: flex; align-items: center; gap: 0.5rem; }
    .mini-player img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
    .me-tag { font-size: 0.65rem; color: var(--accent3); margin-left: 0.3rem; }

    .empty-state { text-align: center; padding: 4rem 1rem; color: var(--text3); }
    .empty-state p { margin-top: 0.5rem; font-size: 0.9rem; }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">Just A Team</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="puzzle.html">Puzzle</a>
    <a href="competition.html" class="active">Competition</a>
    <a href="leaderboard.html">Leaderboard</a>
  </div>
  <div id="nav-auth"></div>
</nav>

<main class="page">
  <h1 class="section-title">Competition</h1>
  <p class="section-sub">5 thử thách — chơi map, submit score ngay sau khi chơi xong</p>
  <div id="comp-grid" class="comp-grid">
    <div class="loading-wrap"><div class="spinner"></div></div>
  </div>
</main>

<div id="toast"></div>
<script src="env.js"></script>
<script src="app.js"></script>
<script>
  let ALL_CHALLENGES = [];

  // State
  const cooldown   = {};  // cooldown[id]   = timestamp hết cooldown
  const bestScores = {};  // bestScores[id] = score tốt nhất của mình
  const lastPlay   = {};  // lastPlay[id]   = play vừa submit { score_val, _updated }
  const lbOpen     = {};  // lbOpen[id]     = leaderboard đang mở không
  const lbCache    = {};  // lbCache[id]    = mảng [{osu_id,name,score}] đã sắp xếp

  // sortOrder theo scoreLabel
  const ASC_LABELS = ['Số miss', 'Thời gian (giây)', 'Số lượng 50'];
  function isAsc(lbl) { return ASC_LABELS.includes(lbl); }

  // ── Format ───────────────────────────────────────────────────
  function fmtVal(val, lbl) {
    if (!val && val !== 0) return '—';
    if (lbl === 'Accuracy (%)') return Number(val).toFixed(2) + '%';
    if (lbl === 'Tổng Score')   return Number(val).toLocaleString('vi-VN');
    return val;
  }

  // ── Render toàn bộ grid ──────────────────────────────────────
  function renderGrid() {
    const user = getUser();
    document.getElementById('comp-grid').innerHTML =
      ALL_CHALLENGES.map(c => buildCard(c, user)).join('');
  }

  function buildCard(c, user) {
    const best    = bestScores[c.id] || 0;
    const hasBest = best > 0;

    const noteHtml = (c.note && c.note.trim())
      ? `<div class="challenge-note">⚠ ${c.note}</div>` : '';

    const filesHtml = (c.files && c.files.length)
      ? `<div class="challenge-files">${
          c.files.map(f => `<a class="file-link" href="${f.url}" target="_blank">↗ ${f.label}</a>`).join('')
        }</div>` : '';

    // Kết quả play — chỉ score_val + better/same tag
    const play = lastPlay[c.id];
    const playHtml = play
      ? `<div class="play-result">
           <span class="play-result-label">${c.scoreLabel}:</span>
           <span class="play-result-val">${fmtVal(play.score_val, c.scoreLabel)}</span>
           <span class="play-result-tag ${play._updated ? 'tag-better' : 'tag-same'}">
             ${play._updated ? '↑ Tốt hơn!' : 'Chưa tốt hơn'}
           </span>
         </div>` : '';

    // Score hiện tại
    const myScore = hasBest
      ? `<div class="current-score">Của bạn: <strong>${fmtVal(best, c.scoreLabel)}</strong></div>`
      : `<span style="font-size:0.78rem;color:var(--text3)">Chưa có score</span>`;

    // Nút submit / cooldown / login
    let actionHtml;
    if (!user) {
      actionHtml = `<span style="font-size:0.8rem;color:var(--text3)">Đăng nhập để tham gia</span>`;
    } else {
      const rem = Math.ceil(((cooldown[c.id] || 0) - Date.now()) / 1000);
      actionHtml = rem > 0
        ? `<span class="cooldown-text" id="cd-${c.id}">Chờ ${rem}s</span>`
        : `<button class="btn-primary btn-submit" id="btn-${c.id}"
             onclick="handleSubmit(${c.id},this)">Submit</button>`;
    }

    // Mini leaderboard
    const isOpen = lbOpen[c.id] || false;
    const lbHtml = buildMiniLb(c, isOpen);

    return `
      <div class="challenge-card ${hasBest ? 'submitted' : ''}" id="card-${c.id}">
        <div class="challenge-header">
          <div class="challenge-name">${c.name}</div>
          <span class="badge-pts" style="background:rgba(0,212,255,0.1);border-color:rgba(0,212,255,0.3);color:var(--accent3)">
            ${c.scoreLabel}
          </span>
        </div>
        <div class="challenge-content">${c.content}</div>
        ${noteHtml}
        ${filesHtml}
        ${playHtml}
        <div class="challenge-footer">
          ${myScore}
          ${actionHtml}
        </div>
        <button class="lb-toggle ${isOpen ? 'open' : ''}" onclick="toggleLb(${c.id})">
          <span>Bảng xếp hạng challenge này</span>
          <span class="chev">▼</span>
        </button>
        ${lbHtml}
      </div>`;
  }

  // ── Mini leaderboard ─────────────────────────────────────────
  function buildMiniLb(c, isOpen) {
    if (!isOpen) return `<div class="mini-lb" id="lb-${c.id}"></div>`;

    const rows = lbCache[c.id];

    // Đang load
    if (rows === undefined) {
      return `<div class="mini-lb open" id="lb-${c.id}">
        <div class="mini-lb-empty">
          <div class="spinner" style="width:18px;height:18px;margin:0 auto 0.5rem"></div>
          Đang tải...
        </div>
      </div>`;
    }

    // Chưa có ai
    if (!rows.length) {
      return `<div class="mini-lb open" id="lb-${c.id}">
        <div class="mini-lb-empty">Chưa có ai submit challenge này</div>
      </div>`;
    }

    const user    = getUser();
    const rankCls = ['r1','r2','r3'];

    const trs = rows.map((p, i) => {
      const isMe   = user && String(p.osu_id) === String(user.uid);
      const avatar = `https://a.ppy.sh/${p.osu_id}`;
      return `<tr class="${isMe ? 'me' : ''}">
        <td class="mini-rank ${rankCls[i] || ''}">${i + 1}</td>
        <td>
          <div class="mini-player">
            <img src="${avatar}" alt="${p.name}"
                 onerror="this.src='https://osu.ppy.sh/assets/images/favicon-32x32.png'">
            <span>${p.name}${isMe ? '<span class="me-tag">(bạn)</span>' : ''}</span>
          </div>
        </td>
        <td class="r" style="font-family:var(--font-display);font-weight:700;color:var(--accent3)">
          ${fmtVal(p.score, c.scoreLabel)}
        </td>
      </tr>`;
    }).join('');

    return `<div class="mini-lb open" id="lb-${c.id}">
      <table class="mini-table">
        <thead><tr>
          <th style="width:32px">#</th>
          <th>Người chơi</th>
          <th class="r">${c.scoreLabel}</th>
        </tr></thead>
        <tbody>${trs}</tbody>
      </table>
    </div>`;
  }

  // ── Toggle leaderboard ───────────────────────────────────────
  async function toggleLb(challengeId) {
    lbOpen[challengeId] = !lbOpen[challengeId];

    // Nếu mở và chưa load → fetch
    if (lbOpen[challengeId] && lbCache[challengeId] === undefined) {
      lbCache[challengeId] = undefined; // trigger loading state
      renderGrid();
      await loadChallengeRankings();
    }

    renderGrid();
  }

  // Lấy scores từng player cho tất cả challenges
  async function loadChallengeRankings() {
    try {
      const res = await apiGet('/api/leaderboard/challenges');
      if (!res?.ok || !res.data) return;

      // res.data = [{ osu_id, name, scores:[s0..s4] }]
      ALL_CHALLENGES.forEach((c, ci) => {
        const ranked = res.data
          .map(p => ({ osu_id: p.osu_id, name: p.name, score: Number(p.scores?.[ci]) || 0 }))
          .filter(p => p.score > 0)
          .sort((a, b) => isAsc(c.scoreLabel) ? a.score - b.score : b.score - a.score);
        lbCache[ci] = ranked;
      });
    } catch (e) {
      // Nếu endpoint chưa có → set cache rỗng để không load lại
      ALL_CHALLENGES.forEach((_, ci) => { lbCache[ci] = lbCache[ci] ?? []; });
      console.warn('loadChallengeRankings:', e);
    }
  }

  // ── Submit ───────────────────────────────────────────────────
  const CD_MS = 10_000;

  async function handleSubmit(challengeId, btn) {
    const rem = ((cooldown[challengeId] || 0) - Date.now());
    if (rem > 0) {
      showToast(`Chờ ${Math.ceil(rem/1000)}s trước khi submit lại.`, 'error');
      return;
    }

    btn.disabled    = true;
    btn.textContent = 'Đang lấy play...';

    const res = await submitScore(challengeId);
    cooldown[challengeId] = Date.now() + CD_MS;

    if (!res) {
      showToast('Lỗi kết nối. Thử lại sau.', 'error');
      renderGrid();
      startCdTimer(challengeId);
      return;
    }

    if (!res.ok) {
      showToast(res.msg || 'Không tìm thấy play phù hợp.', 'error');
      renderGrid();
      startCdTimer(challengeId);
      return;
    }

    // Lưu play result
    if (res.play) {
      lastPlay[challengeId] = { score_val: res.play.score_val, _updated: res.updated };
    }

    if (res.updated && res.newScore !== undefined) {
      bestScores[challengeId] = res.newScore;
      // Reset cache LB để lần sau mở sẽ fetch lại
      delete lbCache[challengeId];
      // Nếu LB đang mở → reload ngay
      if (lbOpen[challengeId]) await loadChallengeRankings();
      showToast('✓ Score mới tốt hơn!', 'success');
    } else if (res.updated === false) {
      showToast('Play này chưa tốt hơn score hiện tại.', '');
    }

    renderGrid();
    startCdTimer(challengeId);
  }

  function startCdTimer(id) {
    const iv = setInterval(() => {
      const el  = document.getElementById(`cd-${id}`);
      const rem = Math.ceil(((cooldown[id] || 0) - Date.now()) / 1000);
      if (!el) { clearInterval(iv); return; }
      if (rem > 0) {
        el.textContent = `Chờ ${rem}s`;
      } else {
        clearInterval(iv);
        el.outerHTML = `<button class="btn-primary btn-submit" id="btn-${id}"
          onclick="handleSubmit(${id},this)">Submit</button>`;
      }
    }, 1000);
  }

  // ── Init ─────────────────────────────────────────────────────
  async function init() {
    try {
      const r        = await fetch('challenges.json');
      ALL_CHALLENGES = await r.json();
    } catch (e) {
      document.getElementById('comp-grid').innerHTML =
        `<div class="empty-state" style="grid-column:1/-1">
          <div style="font-size:2rem">⚠️</div>
          <p>Không tải được challenges.json.</p>
        </div>`;
      return;
    }

    renderGrid();

    // Lấy best scores hiện tại
    const user = getUser();
    if (user) {
      try {
        const pd = await fetchPlayerData(user.uid);
        if (pd?.ok && pd.data?.scores) {
          pd.data.scores.forEach((s, i) => { if (s > 0) bestScores[i] = s; });
          renderGrid();
        }
      } catch (e) { /* không sao */ }
    }
  }

  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
