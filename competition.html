<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competition — JAT Event</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── List layout ─────────────────────────────────────────── */
    .item-list { display: flex; flex-direction: column; gap: 0.5rem; }

    .ch-item {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .ch-item:hover { border-color: var(--border2); }
    .ch-item.done  { border-color: rgba(0,212,255,0.3); }

    /* ── Clickable header row ────────────────────────────────── */
    .ch-header {
      display: flex; align-items: stretch;
      cursor: pointer; user-select: none;
      background: var(--bg2);
      transition: background 0.15s;
    }
    .ch-header:hover { background: var(--bg3); }

    /* left content block */
    .ch-main {
      flex: 1; min-width: 0;
      padding: 0.9rem 1.1rem;
    }
    .ch-name {
      font-family: var(--font-display); font-weight: 700;
      font-size: 1rem; line-height: 1.3;
    }
    .ch-desc {
      font-size: 0.82rem; color: var(--text2);
      margin-top: 0.15rem; white-space: pre-line;
    }

    /* right pill ─ score label */
    .ch-pill {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 0 1.1rem;
      border-left: 1px solid var(--border);
      background: var(--bg3);
      font-family: var(--font-display); font-weight: 700;
      font-size: 0.82rem; color: var(--accent3);
      white-space: nowrap; gap: 0.5rem;
    }
    .ch-pill .done-dot {
      width: 18px; height: 18px; background: var(--accent3); color: #0d0d0f;
      border-radius: 50%; font-size: 0.65rem; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .ch-chev {
      flex-shrink: 0; display: flex; align-items: center;
      padding: 0 0.9rem; color: var(--text3); font-size: 0.65rem;
      border-left: 1px solid var(--border);
      transition: color 0.15s;
    }
    .ch-chev svg { transition: transform 0.18s; }
    .ch-item.open .ch-chev svg { transform: rotate(180deg); }

    /* ── Expanded body ───────────────────────────────────────── */
    .ch-body {
      display: none;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }
    .ch-item.open .ch-body { display: block; }

    /* content + tags row */
    .ch-content-wrap {
      padding: 1rem 1.1rem 0;
    }
    .ch-content {
      font-size: 0.88rem; color: var(--text2);
      line-height: 1.7; white-space: pre-line;
    }
    .ch-note {
      font-size: 0.8rem; color: var(--gold);
      background: rgba(255,209,102,0.07);
      border-left: 2px solid var(--gold);
      padding: 0.4rem 0.8rem; margin-top: 0.7rem;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    /* tags row */
    .ch-tags {
      display: flex; flex-wrap: wrap; gap: 0.35rem;
      padding: 0.65rem 1.1rem 0;
    }
    .ch-tag {
      font-size: 0.72rem; padding: 0.18rem 0.65rem;
      border-radius: 99px; border: 1px solid var(--border2);
      color: var(--text2); background: var(--bg3); white-space: nowrap;
    }
    .ch-tag.mode   { border-color: rgba(0,212,255,0.3); color: var(--accent3); background: rgba(0,212,255,0.07); }
    .ch-tag.type   { border-color: rgba(255,107,157,0.3); color: var(--accent); background: rgba(255,107,157,0.07); }
    .ch-tag.stable { border-color: rgba(255,209,102,0.3); color: var(--gold); background: rgba(255,209,102,0.07); }
    .ch-tag.done-t { border-color: rgba(6,214,160,0.3); color: var(--green); background: rgba(6,214,160,0.07); }

    /* files row */
    .ch-files {
      display: flex; flex-wrap: wrap; gap: 0.45rem;
      padding: 0.65rem 1.1rem;
    }
    .file-link {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.78rem; color: var(--accent3);
      background: rgba(0,212,255,0.07); border: 1px solid rgba(0,212,255,0.2);
      border-radius: var(--radius-sm); padding: 0.28rem 0.7rem;
      text-decoration: none; transition: background 0.15s;
    }
    .file-link:hover { background: rgba(0,212,255,0.15); text-decoration: none; }

    /* submit row */
    .ch-actions {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem; flex-wrap: wrap;
      padding: 0.65rem 1.1rem 0.9rem;
      border-top: 1px solid var(--border);
      margin-top: 0.5rem;
    }
    .ch-my-score { font-size: 0.78rem; color: var(--text3); }
    .ch-my-score strong { font-family: var(--font-display); color: var(--accent3); font-weight: 700; }
    .btn-submit { font-size: 0.8rem; padding: 0.38rem 0.9rem; }
    .cooldown-text { font-size: 0.75rem; color: var(--text3); }

    /* play result */
    .play-result {
      display: flex; align-items: center; gap: 0.6rem;
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 0.45rem 0.85rem;
      font-size: 0.82rem; margin: 0 1.1rem 0.5rem;
    }
    .play-result-label { color: var(--text3); }
    .play-result-val   { font-family: var(--font-display); font-weight: 700; color: var(--accent3); }
    .play-result-tag   { margin-left: auto; font-size: 0.7rem; padding: 0.1rem 0.5rem; border-radius: 99px; }
    .tag-better { background: rgba(6,214,160,0.15); color: var(--green); }
    .tag-same   { background: var(--bg3); color: var(--text3); border: 1px solid var(--border); }

    /* leaderboard toggle */
    .lb-toggle {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      background: var(--bg2); border: none; border-top: 1px solid var(--border);
      padding: 0.6rem 1.1rem; font-size: 0.78rem; color: var(--text2);
      cursor: pointer; transition: background 0.15s; font-family: var(--font-body);
    }
    .lb-toggle:hover { background: var(--bg3); }
    .lb-toggle .lbchev { font-size: 0.6rem; color: var(--text3); transition: transform 0.18s; }
    .lb-toggle.open .lbchev { transform: rotate(180deg); }

    .mini-lb { display: none; border-top: 1px solid var(--border); overflow: hidden; }
    .mini-lb.open { display: block; }
    .mini-lb-empty { text-align: center; padding: 1.1rem; color: var(--text3); font-size: 0.8rem; }
    table.mini-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .mini-table th {
      background: var(--bg3); padding: 0.4rem 1.1rem; text-align: left;
      font-family: var(--font-display); font-size: 0.63rem; font-weight: 700;
      letter-spacing: 0.07em; text-transform: uppercase; color: var(--text3);
      border-bottom: 1px solid var(--border);
    }
    .mini-table th.r, .mini-table td.r { text-align: right; }
    .mini-table td { padding: 0.5rem 1.1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .mini-table tr:last-child td { border-bottom: none; }
    .mini-table tr:hover td { background: var(--bg3); }
    .mini-table tr.me td { background: rgba(0,212,255,0.04); }
    .mini-rank { font-family: var(--font-display); font-weight: 800; width: 28px; text-align: center; }
    .r1{color:var(--gold)} .r2{color:var(--silver)} .r3{color:var(--bronze)}
    .mini-player { display: flex; align-items: center; gap: 0.5rem; }
    .mini-player img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
    .me-tag { font-size: 0.65rem; color: var(--accent3); margin-left: 0.25rem; }

    .empty-state { text-align:center; padding:4rem 1rem; color:var(--text3); }
    .empty-state p { margin-top:0.5rem; font-size:0.9rem; }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="nav-logo">Just A Team</a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="puzzle.html">Puzzle</a>
    <a href="competition.html" class="active">Competition</a>
    <a href="leaderboard.html">Leaderboard</a>
  </div>
  <div id="nav-auth"></div>
</nav>

<main class="page">
  <h1 class="section-title">Competition</h1>
  <p class="section-sub">5 thử thách — chơi map, submit score ngay sau khi chơi xong</p>
  <div id="comp-list" class="item-list">
    <div class="loading-wrap"><div class="spinner"></div></div>
  </div>
</main>

<div id="toast"></div>
<script src="env.js"></script>
<script src="app.js"></script>
<script>
  let ALL_CHALLENGES = [];
  const cooldown={}, bestScores={}, lastPlay={}, lbOpen={}, lbCache={}, expanded={};
  const ASC_LABELS = ['Số miss','Thời gian (giây)','Số lượng 50'];
  function isAsc(l){return ASC_LABELS.includes(l);}

  function fmtVal(val,lbl){
    if(!val&&val!==0)return'—';
    if(lbl==='Accuracy (%)')return Number(val).toFixed(2)+'%';
    if(lbl==='Tổng Score')return Number(val).toLocaleString('vi-VN');
    return val;
  }

  function renderList(){
    const user=getUser();
    document.getElementById('comp-list').innerHTML=ALL_CHALLENGES.map(c=>buildItem(c,user)).join('');
  }

  function buildItem(c,user){
    const best=bestScores[c.id]||0, hasBest=best>0, isOpen=expanded[c.id]||false;

    // tags derived from challenge data
    const tags=[
      c.mode    ? {cls:'mode',  label:'Mode: '+c.mode}   : null,
      c.type    ? {cls:'type',  label:c.type}             : null,
      c.client  ? {cls:'stable',label:c.client}           : null,
      hasBest   ? {cls:'done-t',label:'Đã submit'}        : null,
    ].filter(Boolean);

    const tagsHtml = tags.length
      ? `<div class="ch-tags">${tags.map(t=>`<span class="ch-tag ${t.cls}">${t.label}</span>`).join('')}</div>` : '';

    const noteHtml = (c.note&&c.note.trim()) ? `<div class="ch-note">⚠ ${c.note}</div>` : '';

    const filesHtml = (c.files&&c.files.length)
      ? `<div class="ch-files">${c.files.map(f=>`<a class="file-link" href="${f.url}" target="_blank">↗ ${f.label}</a>`).join('')}</div>` : '';

    const play=lastPlay[c.id];
    const playHtml=play?`<div class="play-result">
      <span class="play-result-label">${c.scoreLabel}:</span>
      <span class="play-result-val">${fmtVal(play.score_val,c.scoreLabel)}</span>
      <span class="play-result-tag ${play._updated?'tag-better':'tag-same'}">${play._updated?'↑ Tốt hơn!':'Chưa tốt hơn'}</span>
    </div>`:'';

    const myScore=hasBest
      ?`<div class="ch-my-score">Của bạn: <strong>${fmtVal(best,c.scoreLabel)}</strong></div>`
      :`<span style="font-size:0.78rem;color:var(--text3)">Chưa có score</span>`;

    let actionHtml;
    if(!user){
      actionHtml=`<span style="font-size:0.8rem;color:var(--text3)">Đăng nhập để tham gia</span>`;
    } else {
      const rem=Math.ceil(((cooldown[c.id]||0)-Date.now())/1000);
      actionHtml=rem>0
        ?`<span class="cooldown-text" id="cd-${c.id}">Chờ ${rem}s</span>`
        :`<button class="btn-primary btn-submit" id="btn-${c.id}" onclick="handleSubmit(${c.id},this)">Submit</button>`;
    }

    const lbHtml=buildMiniLb(c,lbOpen[c.id]||false);

    const bodyHtml=isOpen?`<div class="ch-body">
      <div class="ch-content-wrap">
        <div class="ch-content">${c.content}</div>
        ${noteHtml}
      </div>
      ${tagsHtml}
      ${filesHtml}
      ${playHtml}
      <div class="ch-actions">${myScore}${actionHtml}</div>
      <button class="lb-toggle ${lbOpen[c.id]?'open':''}" onclick="toggleLb(${c.id})">
        <span>Bảng xếp hạng challenge này</span><span class="lbchev">▼</span>
      </button>
      ${lbHtml}
    </div>`:`<div class="ch-body"></div>`;

    return `<div class="ch-item ${hasBest?'done':''} ${isOpen?'open':''}" id="item-${c.id}">
      <div class="ch-header" onclick="toggleExpand(${c.id})">
        <div class="ch-main">
          <div class="ch-name">${c.name}</div>
          <div class="ch-desc">${c.content.split('\n')[0].substring(0,80)}${c.content.length>80?'…':''}</div>
        </div>
        <div class="ch-pill">
          ${hasBest?`<div class="done-dot">✓</div>`:''}
          ${c.scoreLabel}
        </div>
        <div class="ch-chev"><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
      ${bodyHtml}
    </div>`;
  }

  function buildMiniLb(c,isOpen){
    if(!isOpen)return`<div class="mini-lb" id="lb-${c.id}"></div>`;
    const rows=lbCache[c.id];
    if(rows===undefined)return`<div class="mini-lb open" id="lb-${c.id}"><div class="mini-lb-empty"><div class="spinner" style="width:18px;height:18px;margin:0 auto 0.4rem"></div>Đang tải...</div></div>`;
    if(!rows.length)return`<div class="mini-lb open" id="lb-${c.id}"><div class="mini-lb-empty">Chưa có ai submit challenge này</div></div>`;
    const user=getUser(), rankCls=['r1','r2','r3'];
    const trs=rows.map((p,i)=>{
      const isMe=user&&String(p.osu_id)===String(user.uid);
      return`<tr class="${isMe?'me':''}">
        <td class="mini-rank ${rankCls[i]||''}">${i+1}</td>
        <td><div class="mini-player">
          <img src="https://a.ppy.sh/${p.osu_id}" alt="${p.name}" onerror="this.src='https://osu.ppy.sh/assets/images/favicon-32x32.png'">
          <span>${p.name}${isMe?'<span class="me-tag">(bạn)</span>':''}</span>
        </div></td>
        <td class="r" style="font-family:var(--font-display);font-weight:700;color:var(--accent3)">${fmtVal(p.score,c.scoreLabel)}</td>
      </tr>`;
    }).join('');
    return`<div class="mini-lb open" id="lb-${c.id}"><table class="mini-table">
      <thead><tr><th style="width:36px">#</th><th>Người chơi</th><th class="r">${c.scoreLabel}</th></tr></thead>
      <tbody>${trs}</tbody>
    </table></div>`;
  }

  function toggleExpand(id){expanded[id]=!expanded[id];renderList();}

  async function toggleLb(id){
    lbOpen[id]=!lbOpen[id];
    if(lbOpen[id]&&lbCache[id]===undefined){lbCache[id]=undefined;renderList();await loadChallengeRankings();}
    renderList();
  }

  async function loadChallengeRankings(){
    try{
      const res=await apiGet('/api/leaderboard/challenges');
      if(!res?.ok||!res.data)return;
      ALL_CHALLENGES.forEach((c,ci)=>{
        lbCache[ci]=res.data
          .map(p=>({osu_id:p.osu_id,name:p.name,score:Number(p.scores?.[ci])||0}))
          .filter(p=>p.score>0)
          .sort((a,b)=>isAsc(c.scoreLabel)?a.score-b.score:b.score-a.score);
      });
    }catch(e){ALL_CHALLENGES.forEach((_,ci)=>{lbCache[ci]=lbCache[ci]??[];});}
  }

  const CD_MS=10_000;
  async function handleSubmit(challengeId,btn){
    const rem=((cooldown[challengeId]||0)-Date.now());
    if(rem>0){showToast(`Chờ ${Math.ceil(rem/1000)}s trước khi submit lại.`,'error');return;}
    btn.disabled=true;btn.textContent='Đang lấy play...';
    const res=await submitScore(challengeId);
    cooldown[challengeId]=Date.now()+CD_MS;
    if(!res){showToast('Lỗi kết nối. Thử lại sau.','error');renderList();startCdTimer(challengeId);return;}
    if(!res.ok){showToast(res.msg||'Không tìm thấy play phù hợp.','error');renderList();startCdTimer(challengeId);return;}
    if(res.play)lastPlay[challengeId]={score_val:res.play.score_val,_updated:res.updated};
    if(res.updated&&res.newScore!==undefined){
      bestScores[challengeId]=res.newScore;delete lbCache[challengeId];
      if(lbOpen[challengeId])await loadChallengeRankings();
      showToast('✓ Score mới tốt hơn!','success');
    }else if(res.updated===false){showToast('Play này chưa tốt hơn score hiện tại.','');}
    renderList();startCdTimer(challengeId);
  }

  function startCdTimer(id){
    const iv=setInterval(()=>{
      const el=document.getElementById(`cd-${id}`);
      const rem=Math.ceil(((cooldown[id]||0)-Date.now())/1000);
      if(!el){clearInterval(iv);return;}
      if(rem>0){el.textContent=`Chờ ${rem}s`;}
      else{clearInterval(iv);el.outerHTML=`<button class="btn-primary btn-submit" id="btn-${id}" onclick="handleSubmit(${id},this)">Submit</button>`;}
    },1000);
  }

  async function init(){
    try{ALL_CHALLENGES=await(await fetch('challenges.json')).json();}
    catch(e){document.getElementById('comp-list').innerHTML=`<div class="empty-state"><div style="font-size:2rem">⚠️</div><p>Không tải được challenges.json.</p></div>`;return;}
    renderList();
    const user=getUser();
    if(user){try{const pd=await fetchPlayerData(user.uid);if(pd?.ok&&pd.data?.scores){pd.data.scores.forEach((s,i)=>{if(s>0)bestScores[i]=s;});renderList();}}catch(e){}}
  }

  document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
